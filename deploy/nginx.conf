# =============================================================================
# 乌叶MC · 模组许愿池 — Nginx 站点配置（正式版，HTTPS）
# =============================================================================
# 适用：Ubuntu 24.04 LTS + Nginx 1.24（apt 安装）+ certbot 证书。
#
# 使用方法见 deploy/README.md：
#   1. 把本文件里的 wuye.example.com 全部替换成你的真实域名；
#   2. 首次签证书请先用 deploy/nginx-bootstrap.conf（纯 HTTP）跑通；
#   3. 证书就位后：
#        sudo cp deploy/nginx.conf /etc/nginx/sites-available/wuye-mod-hub
#        sudo ln -s /etc/nginx/sites-available/wuye-mod-hub /etc/nginx/sites-enabled/
#        sudo nginx -t && sudo systemctl reload nginx
#
# 重要：Node 进程必须监听 127.0.0.1:8080，且环境变量 TRUST_PROXY=1、
# COOKIE_SECURE=1。否则限流会把所有访客当成同一个 IP，Cookie 也可能不生效。
# =============================================================================

upstream wuye_mod_hub {
    server 127.0.0.1:8080;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# HTTP :80 —— 只做两件事：ACME 证书验证、其余全部 301 到 HTTPS
# -----------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name wuye.example.com;

    # 若服务器没有 IPv6，删掉上面 listen [::]:80; 一行。
    server_tokens off;

    access_log /var/log/nginx/wuye-mod-hub.access.log;
    error_log  /var/log/nginx/wuye-mod-hub.error.log warn;

    # certbot --webroot 的验证文件目录（deploy/README.md 会创建）。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# -----------------------------------------------------------------------------
# HTTPS :443 —— 正式站点
# -----------------------------------------------------------------------------
server {
    # Ubuntu 24.04 自带 Nginx 1.24，只支持下面这种 http2 写法。
    # 如果以后升级到 Nginx >= 1.25.1，可改成：
    #   listen 443 ssl;
    #   listen [::]:443 ssl;
    #   http2 on;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wuye.example.com;

    server_tokens off;

    access_log /var/log/nginx/wuye-mod-hub.access.log;
    error_log  /var/log/nginx/wuye-mod-hub.error.log warn;

    # ---- TLS 证书（certbot 默认路径，替换域名即可）----
    ssl_certificate           /etc/letsencrypt/live/wuye.example.com/fullchain.pem;
    ssl_certificate_key       /etc/letsencrypt/live/wuye.example.com/privkey.pem;
    ssl_trusted_certificate   /etc/letsencrypt/live/wuye.example.com/chain.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_session_cache shared:WUYE_SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ---- 安全响应头 ----
    # HSTS 由 Nginx 统一下发；先隐藏 Node 自己发的同名头，避免出现两个。
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 其余安全头（CSP、X-Frame-Options、Referrer-Policy、Permissions-Policy、
    # COOP/CORP、X-Content-Type-Options）由 app 的 lib/http.js 统一发出，
    # 这里不要重复 add_header，否则浏览器会收到两份互相叠加的策略。

    # 本站只接收 JSON 请求，1MB 足够；超过直接由 Nginx 拒绝。
    client_max_body_size 1m;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/xml
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 静态图片/字体：与 Node 保持一致的 7 天缓存 ----
    # 图片是同名覆盖后仍会被缓存 7 天，换图请改文件名或加 ?v=。
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico|woff2)$ {
        proxy_pass http://wuye_mod_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_hide_header Cache-Control;
        expires 7d;
        access_log off;
    }

    # ---- 页面与 API：全部交给 Node ----
    location / {
        proxy_pass http://wuye_mod_hub;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_buffering on;
    }
}
