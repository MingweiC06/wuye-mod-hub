# =============================================================================
# 乌叶MC · 模组许愿池 — Nginx 引导配置（首次签发证书前使用，纯 HTTP）
# =============================================================================
# 用途：新服务器在还没有 TLS 证书时，先用这份配置让 site 能跑起来，
#       并用 certbot 的 webroot 模式完成域名验证。
#
# 流程（详见 deploy/README.md）：
#   1. 把下面的 wuye.example.com 替换成真实域名；
#   2. sudo cp deploy/nginx-bootstrap.conf /etc/nginx/sites-available/wuye-mod-hub
#      sudo ln -s /etc/nginx/sites-available/wuye-mod-hub /etc/nginx/sites-enabled/
#      sudo nginx -t && sudo systemctl reload nginx
#   3. sudo certbot certonly --webroot -w /var/www/certbot \
#        -d wuye.example.com --email 你的邮箱 --agree-tos --no-eff-email
#   4. 签发成功后，用 deploy/nginx.conf 覆盖同一路径，再 nginx -t && reload。
#
# 注意：这份配置是 HTTP 明文，只适合部署当天使用，不要长期挂着。
#       如果域名尚未备案/解析未生效，certbot 验证会失败，见 README 的说明。
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name wuye.example.com;

    server_tokens off;

    access_log /var/log/nginx/wuye-mod-hub.access.log;
    error_log  /var/log/nginx/wuye-mod-hub.error.log warn;

    client_max_body_size 1m;

    # certbot --webroot 验证目录。
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        access_log off;
    }

    # 证书签发前先用 HTTP 验证整站是否正常；签发后再改成 HTTPS 强制跳转。
    # 这里直接写 127.0.0.1:8080：本文件单独使用时不依赖 nginx.conf 里的 upstream。
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
